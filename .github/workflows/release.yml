name: Release

# Publishes a tag vX.Y.Z. prepare-release.yml dispatches this on the tag it
# creates; pushing a tag by hand also works.
#   build            builds the binaries once (build.yml): tarballs, wheels, npm packages
#   publish-pypi     PyPI trusted publishing (OIDC, environment "pypi", no token)
#   publish-npm      npm trusted publishing (OIDC, environment "npm", no token)
#   github-release   tarballs and SHA-256 files install.sh reads, plus git-cliff notes
#   verify           installs the published packages on Linux, macOS and Windows
#
# Trusted publishers on PyPI and npm are bound to this file name: renaming
# release.yml breaks publishing until both registries are updated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag ref"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "$TAG" = "v$version" || { echo "::error::Cargo.toml has $version, tag is $TAG"; exit 1; }

  build:
    needs: gate
    uses: ./.github/workflows/build.yml

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish to npm (trusted publishing)
    # The launcher downloads from the GitHub Release, so the assets must exist first.
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages
      - name: npm publish (skips a version already on the registry)
        run: |
          set -euo pipefail
          tgz="$(ls ./npm-packages/oncebitten-[0-9]*.tgz)"
          spec="$(tar -xzOf "$tgz" package/package.json | jq -r '.name + "@" + .version')"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm."
          else
            npm publish "$tgz" --provenance --access public
          fi

  github-release:
    name: GitHub Release
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # git-cliff hits the /pulls API (see prepare-release.yml).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Release notes (git-cliff)
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: dist/*
          body: |
            ${{ steps.notes.outputs.content }}

            ---

            Install: `uvx oncebitten`, `npx oncebitten`, or `curl -fsSL https://raw.githubusercontent.com/bcmyguest/oncebitten/${{ needs.gate.outputs.tag }}/install.sh | sh`. See https://bcmyguest.github.io/oncebitten/install/.

  verify:
    name: Verify the published packages
    needs: [gate, publish-pypi, publish-npm]
    uses: ./.github/workflows/smoke.yml
    with:
      source: published
      version: ${{ needs.gate.outputs.version }}
