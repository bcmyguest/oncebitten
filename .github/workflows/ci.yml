name: CI

# fmt, clippy and the test suite on every push to main and every pull request;
# the oncebitten gate on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy and test (intent feature)
        run: |
          cargo clippy --all-targets --features intent -- -D warnings
          cargo test --features intent --lib intent
          cargo test --features intent --test intent_fixture

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --no-fail-fast

  gate:
    # Required check name: "oncebitten gate". Keep it stable.
    name: oncebitten gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sync rules at the locked commits
        run: cargo run --locked --bin oncebitten -- rules sync --frozen
      - name: oncebitten gate pr
        run: cargo run --locked --bin oncebitten -- gate pr --base "origin/${{ github.base_ref }}"

  packaging:
    name: packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm package manifests
        run: node --test scripts/npm-package.test.mjs
