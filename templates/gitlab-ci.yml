# oncebitten gate for GitLab CI. Add this job to .gitlab-ci.yml.
# Require it with "Pipelines must succeed" in the project's merge request settings.
oncebitten-gate:
  image: buildpack-deps:stable-curl
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # The gate diffs against the merge-base with the target branch.
    GIT_DEPTH: "0"
  script:
    # Pin the release for reproducible gates.
    - curl -fsSL https://raw.githubusercontent.com/bcmyguest/oncebitten/v0.4.0/install.sh | ONCEBITTEN_VERSION=0.4.0 sh
    - export PATH="$HOME/.local/bin:$PATH"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - oncebitten rules sync --frozen
    - oncebitten gate pr --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
