# oncebitten gate for GitHub Actions. Copy to .github/workflows/oncebitten.yml.
# Mark the check "oncebitten gate" as required in the branch protection rule.
name: oncebitten

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: oncebitten gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge-base with the target branch.
          fetch-depth: 0
      # Pin the release for reproducible gates.
      - name: Install oncebitten
        run: |
          curl -fsSL https://raw.githubusercontent.com/bcmyguest/oncebitten/v0.3.0/install.sh | ONCEBITTEN_VERSION=0.3.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync rules at the locked commits
        run: oncebitten rules sync --frozen
      - name: Gate
        run: oncebitten gate pr --base "origin/${{ github.base_ref }}"
