# Hooks this repository provides to the pre-commit framework.
# `language: rust` makes pre-commit run `cargo install --bins --path .` on this
# repository on first use, so users need no prebuilt binary. See docs/gate.md.
- id: oncebitten-gate
  name: oncebitten gate
  description: Block a push that adds a violation of an active oncebitten block rule.
  entry: oncebitten gate pre-push
  language: rust
  stages: [pre-push]
  pass_filenames: false
  always_run: true
  minimum_pre_commit_version: "3.2.0"

# Runs the `oncebitten` on PATH (install.sh or install.ps1): nothing to build.
- &system
  id: oncebitten-gate-system
  name: oncebitten gate
  description: Block a push that adds a violation of an active oncebitten block rule.
  entry: oncebitten gate pre-push
  language: system
  stages: [pre-push]
  pass_filenames: false
  always_run: true
  minimum_pre_commit_version: "3.2.0"

# Installs the prebuilt `oncebitten` wheel from PyPI into the hook's virtualenv:
# no Rust toolchain and no separate install step. Keep the pin in step with the
# release; set-version.sh does.
- <<: *system
  id: oncebitten-gate-python
  language: python
  additional_dependencies: ["oncebitten==0.4.0"]
