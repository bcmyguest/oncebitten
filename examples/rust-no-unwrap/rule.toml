id = "rust-no-unwrap"
description = "Do not call unwrap; clippy::unwrap_used finds it."
mode = "block"
status = "proposed"
engine = "native"
language = "rust"
command = ["cargo", "clippy", "--quiet", "--message-format=json", "--", "-D", "clippy::unwrap_used"]
fired_exit_codes = [101]
fired_output_contains = "\"code\":\"clippy::unwrap_used\""
