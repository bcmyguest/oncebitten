[package]
name = "oncebitten"
version = "0.0.0"
edition = "2021"
description = "Turns repeated agent mistakes into git-enforced rules"
license = "Apache-2.0"
repository = "https://github.com/bcmyguest/oncebitten"
readme = "README.md"

[[bin]]
name = "oncebitten"
path = "src/main.rs"

[lib]
name = "oncebitten"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ast-grep-config = "0.51.2"
ast-grep-core = "0.51.2"
ast-grep-language = { version = "0.51.2", default-features = false, features = ["tree-sitter-python", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
