[package]
name = "oncebitten"
version = "0.1.1"
edition = "2021"
description = "Turns repeated agent mistakes into git-enforced rules"
license = "Apache-2.0"
repository = "https://github.com/bcmyguest/oncebitten"
readme = "README.md"

[[bin]]
name = "oncebitten"
path = "src/main.rs"

[[bin]]
name = "oncebitten-checker"
path = "src/bin/oncebitten-checker.rs"

[[bin]]
name = "fake-forge"
path = "tests/support/fake_forge.rs"
# Test-only: the wheel build turns default features off, so it never ships.
required-features = ["test-support"]

[[bin]]
name = "fake-host"
path = "tests/support/fake_host.rs"
# Test-only: the wheel build turns default features off, so it never ships.
required-features = ["test-support"]

[lib]
name = "oncebitten"
path = "src/lib.rs"

[features]
default = ["test-support"]
test-support = []
# Experimental prompt-intent classifier (docs/research/intent-classifier.md). Off by default: nothing in the binary calls it.
intent = ["dep:model2vec-rs"]

[dependencies]
anyhow = "1"
ast-grep-config = "0.51.2"
ast-grep-core = "0.51.2"
ast-grep-language = { version = "0.51.2", default-features = false, features = ["tree-sitter-python", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript"] }
clap = { version = "4", features = ["derive"] }
dunce = "1.0.5"
globset = "0.4"
regex = "1"
include_dir = "0.7"
jiff = { version = "0.2.45", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
model2vec-rs = { version = "0.4.0", default-features = false, features = ["onig"], optional = true }
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"

[[example]]
name = "intent_eval"
required-features = ["intent"]

[[test]]
name = "intent_fixture"
required-features = ["intent"]
