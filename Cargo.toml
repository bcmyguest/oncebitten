[package]
name = "oncebitten"
version = "0.0.0"
edition = "2021"
description = "Turns repeated agent mistakes into git-enforced rules"
license = "Apache-2.0"
repository = "https://github.com/bcmyguest/oncebitten"
readme = "README.md"

[[bin]]
name = "oncebitten"
path = "src/main.rs"

[lib]
name = "oncebitten"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
